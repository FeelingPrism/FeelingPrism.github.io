<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvit Tengse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #020408;
            --accent-sapphire: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-deep);
            background: 
                radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(30, 58, 138, 0.08) 0%, transparent 40%),
                var(--bg-deep);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .nav-blur {
            backdrop-filter: blur(24px);
            background: rgba(2, 4, 8, 0.8);
            border-bottom: 1px solid var(--glass-border);
        }

        .content-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .content-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 800;
        }

        .text-gradient {
            background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .premium-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .premium-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            text-transform: uppercase;
        }

        .page-fade {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link {
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-link.active {
            color: #3b82f6;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -31px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }

        .photo-grid-item {
            aspect-ratio: 4/5;
            overflow: hidden;
            border-radius: 1.5rem;
            position: relative;
            background: #0f172a;
            border: 1px solid var(--glass-border);
        }

        .photo-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-grid-item:hover img {
            transform: scale(1.08);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 80%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            z-index: 10;
        }

        .photo-grid-item:hover .photo-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

        function showPage(pageId) {
            const contentDiv = document.getElementById('page-content');
            contentDiv.style.opacity = '0';
            
            setTimeout(() => {
                contentDiv.innerHTML = pages[pageId];
                lucide.createIcons();
                
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active', 'text-white');
                    link.classList.add('text-slate-400');
                });
                
                const activeLink = document.getElementById(`nav-${pageId}`);
                if (activeLink) {
                    activeLink.classList.add('active', 'text-white');
                    activeLink.classList.remove('text-slate-400');
                }
                
                contentDiv.style.opacity = '1';
                window.scrollTo(0, 0);
            }, 150);
        }

        window.onload = () => showPage('home');

</body>
</html>
