<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvit Tengse | Engineering Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #020408;
            --accent-sapphire: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-deep);
            background: 
                radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(30, 58, 138, 0.08) 0%, transparent 40%),
                var(--bg-deep);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.02em;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .nav-blur {
            backdrop-filter: blur(24px);
            background: rgba(2, 4, 8, 0.8);
            border-bottom: 1px solid var(--glass-border);
        }

        .content-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .content-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 800;
        }

        .text-gradient {
            background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .premium-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .premium-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            text-transform: uppercase;
        }

        .page-fade {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link {
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-link.active {
            color: #3b82f6;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -31px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-[100] nav-blur">
        <div class="max-w-6xl mx-auto px-8 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showPage('home')">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-extrabold text-sm shadow-[0_0_15px_rgba(59,130,246,0.5)]">A</div>
                <span class="font-extrabold text-sm tracking-widest uppercase">Anvit Tengse</span>
            </div>
            <div class="hidden md:flex gap-12 items-center">
                <span onclick="showPage('home')" id="nav-home" class="nav-link text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white active">Home</span>
                <span onclick="showPage('interests')" id="nav-interests" class="nav-link text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white">Interests</span>
                <a href="mailto:contact@anvittengse.com" class="text-xs font-bold uppercase tracking-widest text-blue-500 border border-blue-500/30 px-4 py-2 rounded-full hover:bg-blue-500/10 transition-all">Contact</a>
            </div>
        </div>
    </nav>

    <div id="page-content" class="pt-20">
        <!-- Content injected here via JS -->
    </div>

    <!-- Footer -->
    <footer class="py-20 px-8 border-t border-white/5 bg-[#010204]">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-3">
                <div class="w-6 h-6 bg-blue-600/20 rounded flex items-center justify-center font-bold text-[10px] text-blue-500">A</div>
                <span class="text-[10px] font-bold tracking-[0.3em] uppercase text-slate-500">Anvit Tengse // M . M . XXVI</span>
            </div>
            <div class="flex gap-10">
                <i data-lucide="github" class="w-5 h-5 text-slate-600 hover:text-white cursor-pointer transition-colors"></i>
                <i data-lucide="instagram" class="w-5 h-5 text-slate-600 hover:text-white cursor-pointer transition-colors"></i>
            </div>
        </div>
    </footer>

    <script>
        const pages = {
            home: `
                <section class="page-fade">
                    <!-- Hero -->
                    <div class="min-h-[85vh] flex flex-col justify-center items-center px-6 text-center">
                        <h1 class="text-7xl md:text-[10rem] font-extrabold mb-8 text-gradient uppercase tracking-tighter leading-[0.85] drop-shadow-2xl">
                            Anvit <br> Tengse
                        </h1>
                        <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed mb-12 font-medium">
                            Year 10 Wilmington Grammar student. Aspiring Aeronautical Engineer who is passionate about the aviation, automotive and defence industry.
                        </p>
                        <div class="flex flex-col md:flex-row gap-4">
                            <button onclick="showPage('interests')" class="premium-btn px-12 py-5 rounded-full font-bold text-xs uppercase tracking-[0.2em]">View Dossier</button>
                            <a href="#about" class="px-12 py-5 rounded-full border border-white/10 font-bold text-xs uppercase tracking-[0.2em] hover:bg-white/5 transition-all flex items-center gap-2">Core Competencies <i data-lucide="chevron-down" class="w-4 h-4"></i></a>
                        </div>
                    </div>

                    <!-- Core Skills -->
                    <div id="about" class="py-32 px-8 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="content-card p-10 rounded-[2rem]">
                            <div class="w-12 h-12 bg-blue-500/10 rounded-2xl flex items-center justify-center text-blue-500 mb-8"><i data-lucide="layers"></i></div>
                            <h3 class="text-xl font-bold mb-4">Fusion 360</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">Advanced CAD modeling for mechanical components and custom chassis design. Specializing in assembly hierarchy, complex surfacing, and precision tolerancing for additive manufacturing.</p>
                        </div>
                        <div class="content-card p-10 rounded-[2rem]">
                            <div class="w-12 h-12 bg-blue-500/10 rounded-2xl flex items-center justify-center text-blue-500 mb-8"><i data-lucide="cpu"></i></div>
                            <h3 class="text-xl font-bold mb-4">Hardware Modding</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">Unix-based system optimization and kernel-level tuning. Extensive experience in deploying AOSP-based environments and custom recovery modules for hardware-level performance gains.</p>
                        </div>
                        <div class="content-card p-10 rounded-[2rem]">
                            <div class="w-12 h-12 bg-blue-500/10 rounded-2xl flex items-center justify-center text-blue-500 mb-8"><i data-lucide="plane"></i></div>
                            <h3 class="text-xl font-bold mb-4">Aeronautics</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">Structural analysis of airframe integrity and fluid dynamic efficiency. Researching high-speed flight mechanics and materials science for the Imperial College MEng track.</p>
                        </div>
                    </div>

                    <!-- Snapshot Stats -->
                    <div class="py-24 border-y border-white/5 bg-white/[0.01]">
                        <div class="max-w-6xl mx-auto px-8 grid grid-cols-2 md:grid-cols-4 gap-12 text-center md:text-left">
                            <div><div class="stat-label mb-4">School</div><div class="text-2xl font-extrabold tracking-tight">Wilmington <br> Grammar</div></div>
                            <div><div class="stat-label mb-4">STEM Target</div><div class="text-2xl font-extrabold tracking-tight text-gradient">Grade 9 (A*)</div></div>
                            <div><div class="stat-label mb-4">Cadet Status</div><div class="text-2xl font-extrabold tracking-tight">Active Duty</div></div>
                            <div><div class="stat-label mb-4">Ambition</div><div class="text-2xl font-extrabold tracking-tight">Imperial MEng</div></div>
                        </div>
                    </div>
                </section>
            `,
            interests: `
                <section class="page-fade py-20 px-8 max-w-6xl mx-auto">
                    <div class="mb-20 text-center">
                        <span class="stat-label">Technical Interests</span>
                        <h2 class="text-5xl md:text-7xl font-extrabold mt-4 text-gradient uppercase tracking-tight">Focus Areas</h2>
                        <p class="text-slate-400 mt-6 max-w-2xl mx-auto">Detailed technical analysis of mechanical systems, defense technology, and hardware-software integration.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Automotive Card -->
                        <div class="content-card p-12 rounded-[2.5rem]">
                            <div class="flex justify-between items-start mb-10">
                                <div class="w-14 h-14 bg-blue-500/10 rounded-2xl flex items-center justify-center text-blue-500"><i data-lucide="car" class="w-8 h-8"></i></div>
                                <span class="tag">Automotive</span>
                            </div>
                            <h3 class="text-2xl font-bold mb-6">Mechanical Engineering & Lightweight Platforms</h3>
                            <p class="text-slate-400 leading-relaxed mb-6">
                                Specialized technical analysis of the Mazda MX-5 NA and ND platforms. Research focuses on the original NA's weight-saving minimalism (940kg curb weight) versus the ND's modern Skyactiv-G engineering, specifically evaluating power-to-weight ratios and torque-sensing Limited Slip Differentials.
                            </p>
                            <p class="text-slate-400 leading-relaxed">
                                Evaluating "Jinba Ittai" principles through 50/50 weight distribution, center-of-gravity optimization, and the mechanical advantages of double-wishbone versus multilink suspension geometry in high-performance roadsters.
                            </p>
                        </div>

                        <!-- Military Card -->
                        <div class="content-card p-12 rounded-[2.5rem]">
                            <div class="flex justify-between items-start mb-10">
                                <div class="w-14 h-14 bg-red-500/10 rounded-2xl flex items-center justify-center text-red-500"><i data-lucide="shield" class="w-8 h-8"></i></div>
                                <span class="tag bg-red-500/10 text-red-400 border border-red-500/20">Military Tech</span>
                            </div>
                            <h3 class="text-2xl font-bold mb-6">Armored Vehicle Survivability</h3>
                            <p class="text-slate-400 leading-relaxed mb-6">
                                Comparative study of modern Main Battle Tank (MBT) architecture. Focused on the survivability profiles of the T-90MS and Type 99A, specifically evaluating the integration of Explosive Reactive Armor (ERA) against APFSDS kinetic energy penetrators.
                            </p>
                            <p class="text-slate-400 leading-relaxed">
                                Analysis extends to Active Protection System (APS) hard-kill interception logic, multi-spectral camouflage for signature reduction, and the role of fire-control systems in modern asymmetrical combat theaters.
                            </p>
                        </div>

                        <!-- Modding/Hardware Card -->
                        <div class="content-card p-12 rounded-[2.5rem]">
                            <div class="flex justify-between items-start mb-10">
                                <div class="w-14 h-14 bg-purple-500/10 rounded-2xl flex items-center justify-center text-purple-500"><i data-lucide="cpu" class="w-8 h-8"></i></div>
                                <span class="tag bg-purple-500/10 text-purple-400 border border-purple-500/20">Hardware Optimization</span>
                            </div>
                            <h3 class="text-2xl font-bold mb-6">Mobile Computing & Kernel Development</h3>
                            <p class="text-slate-400 leading-relaxed mb-6">
                                Specialized in Android hardware optimization and low-level system architecture. Proficient in bootloader unlocking and the deployment of AOSP-based ROMs to bypass manufacturer-imposed performance throttles and data telemetry.
                            </p>
                            <p class="text-slate-400 leading-relaxed">
                                Tuning Snapdragon architectures (8 Gen 3 / 730) via custom kernels to optimize thermal governors, CPU voltage offsets, and instruction throughput on OnePlus and Xiaomi Mi platforms to maximize computational efficiency.
                            </p>
                        </div>

                        <!-- Photography Card -->
                        <div class="content-card p-12 rounded-[2.5rem]">
                            <div class="flex justify-between items-start mb-10">
                                <div class="w-14 h-14 bg-orange-500/10 rounded-2xl flex items-center justify-center text-orange-500"><i data-lucide="camera" class="w-8 h-8"></i></div>
                                <span class="tag bg-orange-500/10 text-orange-400 border border-orange-500/20">Visual Arts</span>
                            </div>
                            <h3 class="text-2xl font-bold mb-6">Technical Mobile Photography</h3>
                            <p class="text-slate-400 leading-relaxed mb-6">
                                Utilizing advanced mobile sensor technology to capture high-dynamic-range (HDR) subjects in engineering and landscape photography. Specialized focus on manual exposure control, ISO management, and post-processing color science for technical clarity.
                            </p>
                            <div class="flex items-center gap-4 p-5 rounded-2xl bg-orange-500/5 border border-orange-500/10">
                                <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-orange-500/20 flex items-center justify-center text-orange-400 font-extrabold text-lg">3rd</div>
                                <p class="text-xs font-bold text-slate-300 leading-relaxed uppercase tracking-wider">Awarded 3rd Place in the Annual Photography Competition for exceptional technical composition and light management.</p>
                            </div>
                        </div>

                        <!-- Simulation Card -->
                        <div class="content-card p-12 rounded-[2.5rem] md:col-span-2">
                            <div class="flex justify-between items-start mb-10">
                                <div class="w-14 h-14 bg-emerald-500/10 rounded-2xl flex items-center justify-center text-emerald-500"><i data-lucide="target" class="w-8 h-8"></i></div>
                                <span class="tag bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Simulations</span>
                            </div>
                            <h3 class="text-2xl font-bold mb-6">Applied Physics Simulations</h3>
                            <p class="text-slate-400 leading-relaxed mb-0">
                                Utilizing high-fidelity simulation environments including War Thunder and Forza Horizon as virtual laboratories for observing real-world mechanical behavior. Key research areas involve ballistic penetration physics (KE vs CE), aerodynamic drag coefficients on varied airframe geometries, and the analysis of suspension travel under dynamic G-loading during high-speed maneuvers. This practical observation bridges the gap between theoretical physics and mechanical application, allowing for rapid iteration in CAD design.
                            </p>
                        </div>
                    </div>
                </section>
            `
        };

        function showPage(pageId) {
            const contentDiv = document.getElementById('page-content');
            contentDiv.innerHTML = pages[pageId];
            lucide.createIcons();
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active', 'text-white');
                link.classList.add('text-slate-400');
            });
            const activeLink = document.getElementById(`nav-${pageId}`);
            if (activeLink) {
                activeLink.classList.add('active', 'text-white');
                activeLink.classList.remove('text-slate-400');
            }
            window.scrollTo(0, 0);
        }

        window.onload = () => showPage('home');
    </script>
</body>
</html>
